       below stays in this exact original row/column flex layout -- and
       keeps every dynamic behavior tied to it (Shells/Network sizing
       each other, Log/GRC's own natural/shrink sizing, the responsive
       :has() rules in dashboard-panels.css) -- until the moment the user
       actually drags its header or its resize grip. Only THEN does that
       one panel detach to a free position/size (frozen from wherever it
       already was on screen at that instant, so nothing jumps), which
       persists per dashboard. A panel nobody has touched is completely
       unaffected by any of this, forever. -->

  // the dashboard picker) -- that one also validates the id against
  // getDashboards() and defaults dashboardId itself when missing, but
  // needs DOM that isn't ready yet this early. A background lookup on
  // an id that turns out to not exist just misses (falls through to
  // the page's own default) either way, so the extra validation isn't
  // needed here.
  const wallpaperDashboardId = new URLSearchParams(window.location.search).get("id") || "default";

      gaugeSelector: ".hud-gauge",
      logSelector: "#hudLogBody",
      clockSelector: "#hudClock",
      intervalMs: 45000
    });
  }
  initNetworkSection();
  initDashboardPanels();
</script>

<!-- UPCOMING REVIEWS PANEL (TodoGRC.txt #6) -- dérivé des dates déjà
     présentes dans les registres actifs/risques, aucun stockage propre.
     Juste les getters : pas d'appel à initGrc*Registry() ici. -->
<script src="../assets/script/config-io.js"></script>
<script src="../assets/script/grc-assets.js"></script>
<script src="../assets/script/grc-risks.js"></script>
<script>
  function renderUpcomingReviews() {
    const container = document.getElementById("upcomingReviewsList");
    const items = [];
    getGrcAssets().forEach((a) => {
      if (a.nextReviewDate) items.push({ label: a.name, date: a.nextReviewDate, kind: "Actif" });
    });
    getGrcRisks().forEach((r) => {
      if (r.reviewDate) items.push({ label: r.name, date: r.reviewDate, kind: "Risque" });
    });
    items.sort((a, b) => a.date.localeCompare(b.date));

    if (items.length === 0) {
      container.innerHTML = '<p class="netcfg-desc">Aucune date de revue enregistrée sur les registres Actifs/Risques.</p>';
      return;
    }

    const today = new Date().toISOString().slice(0, 10);
    container.innerHTML = items.slice(0, 5).map((it) => {
      const overdue = it.date < today;
      return '<div class="upcoming-review-row' + (overdue ? " overdue" : "") + '">' +
        '<span>' + it.kind + ' — ' + it.label + '</span>' +
        '<span class="upcoming-review-date">' + it.date + (overdue ? " (en retard)" : "") + '</span>' +
        '</div>';
    }).join("");
  }
  renderUpcomingReviews();
</script>


<!-- TOOLS MODAL -->
<script src="../assets/script/tools-config.js"></script>
<script>
  // One tile per entry in the Tools category registry (see
  // assets/script/tools-config.js, managed from Settings > Config Tools)
  // -- the 10 built-ins point at their existing static tools/*.html page,
  // anything added via the builder points at tools/custom.html?catId=...
  function renderToolsPanel() {
    const grid = document.getElementById("toolsPanelGrid");
    grid.innerHTML = "";
    getToolsCategories().forEach((cat) => {
      const tile = document.createElement("div");
      tile.className = "tool-tile";
      tile.onclick = () => openToolModal(cat.id);
      const title = document.createElement("div");
      title.className = "tool-tile-title";
      title.textContent = cat.title;
      tile.appendChild(title);
      const sub = document.createElement("div");
      sub.className = "tool-tile-sub";
      sub.textContent = cat.sub || "";
      tile.appendChild(sub);
      grid.appendChild(tile);
    });
  }
  renderToolsPanel();

  // getCategoryFn defaults to the Tools registry -- the DevSecOps panel
  // below passes getDevSecOpsCategory instead, reusing the same modal
  // (only one of these panels' modals is ever open at a time) since the
  // two registries are otherwise identical in shape (id/title/page).
  function openToolModal(catId, getCategoryFn) {
    const cat = (getCategoryFn || getToolsCategory)(catId);
    if (!cat) return;
    const frame = document.getElementById("modal-tool-frame");
    frame.style.height = "100px";
    document.getElementById("modal-tool-title").textContent = cat.title;
    frame.src = "../tools/" + cat.page;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("modal-tool").style.display = "flex";
    // Lets index.html drop the persistent shells overlay behind #frame
    // while this is open -- see the "tool-modal-state" handler in
    // assets/script/shells-host.js.
    window.top.postMessage({ type: "tool-modal-state", open: true }, "*");
  }

  function closeToolModal() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("modal-tool").style.display = "none";
    document.getElementById("modal-tool-frame").src = "about:blank";
    window.top.postMessage({ type: "tool-modal-state", open: false }, "*");
  }

  // Embedded tools/*.html pages report their real content height so the
  // iframe can be sized exactly to it -- no dead space, no inner scrollbar.
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "tool-frame-height") {
      const frame = document.getElementById("modal-tool-frame");
      if (frame.contentWindow === e.source) {
        frame.style.height = e.data.height + "px";
      }
    }
  });
</script>

<!-- WEBSITE MODAL (same pattern as website.html's openOsintModal) -->
<script src="../assets/script/website-config.js"></script>
<script>
  // One tile per entry in the Website category registry (see
  // assets/script/website-config.js, managed from Settings > Config
  // Website).
  function renderWebsitePanel() {
    const grid = document.getElementById("websitePanelGrid");
    grid.innerHTML = "";
    getWebsiteCategories().forEach((cat) => {
      const tile = document.createElement("div");
      tile.className = "tool-tile";
      tile.onclick = () => openWebsiteModal(cat.title, cat.links || []);
      const title = document.createElement("div");
      title.className = "tool-tile-title";
      title.textContent = cat.title;
      tile.appendChild(title);
      const sub = document.createElement("div");
      sub.className = "tool-tile-sub";
      sub.textContent = cat.sub || "";
      tile.appendChild(sub);
      grid.appendChild(tile);
    });
  }
  renderWebsitePanel();

  function openWebsiteModal(title, links) {
    document.getElementById("website-title").textContent = title;

    // Name alone (no visible URL) made it impossible to tell where a
    // link actually goes without hovering or clicking it -- the URL is
    // now shown as its own line under the name, not just left in the
    // href attribute.
    let html = '<ul class="website-link-list">';
    links.forEach(link => {
      html += `<li class="website-link-row"><a href="${link.url}" target="_blank" rel="noopener">` +
        `<span class="website-link-name">${link.name}</span>` +
        `<span class="website-link-url">${link.url}</span>` +
        `</a></li>`;
    });
    html += "</ul>";

    document.getElementById("website-content").innerHTML = html;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("modal-website").style.display = "flex";
    window.top.postMessage({ type: "tool-modal-state", open: true }, "*");
  }

  function closeWebsiteModal() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("modal-website").style.display = "none";
    window.top.postMessage({ type: "tool-modal-state", open: false }, "*");
  }
</script>

<!-- DASHBOARD SWITCHER -- which dashboard this load of the page is (see
     assets/script/dashboards.js): read from ?id=, default when absent or
     unknown (eg. a dashboard deleted from another tab). Settings has one
     "Sections du Dashboard" card per entry in the same registry. -->
<script>
  const requestedDashboardId = new URLSearchParams(window.location.search).get("id") || "default";
  const currentDashboardId = getDashboards().some((d) => d.id === requestedDashboardId) ? requestedDashboardId : "default";

  document.querySelector(".category-title").textContent = getDashboard(currentDashboardId).name;

  function goToDashboard(id) {
    window.location.href = "dashboard.html" + (id === "default" ? "" : "?id=" + encodeURIComponent(id));
  }

  function renderDashboardMenu() {
    const menu = document.getElementById("dashboardMenu");
    menu.innerHTML = "";
    getDashboards().forEach((d) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dash-shell-menu-item";
      btn.textContent = (d.id === currentDashboardId ? "● " : "") + d.name;
      btn.onclick = () => goToDashboard(d.id);
      menu.appendChild(btn);
    });

    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "dash-shell-menu-item";
    addBtn.textContent = "+ Add Dashboard";
    addBtn.onclick = () => {
      const name = prompt("Nom du nouveau dashboard :");
      if (!name || !name.trim()) return;
      goToDashboard(addDashboard(name.trim()));
    };
    menu.appendChild(addBtn);
  }

  renderDashboardMenu();

  (function initDashboardPicker() {
    const picker = document.getElementById("dashboardPicker");
    const btn = document.getElementById("btnDashboardMenu");
    const menu = document.getElementById("dashboardMenu");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      // Close any other open picker menu (eg. the "+ Shell" one) first --
      // see the matching comment in dashboard-shells.js's initShellPicker.
      document.querySelectorAll(".dash-shell-menu.open").forEach((m) => {
        if (m !== menu) m.classList.remove("open");
      });
      menu.classList.toggle("open");
      notifyShellMenuState();
    });
    document.addEventListener("click", (e) => {
      if (!picker.contains(e.target)) {
        menu.classList.remove("open");
        notifyShellMenuState();
      }
    });
  })();
</script>


<!-- "☰ Panneaux" picker -- same toggles as Settings > Sections du
     Dashboard (DASHBOARD_SECTIONS, assets/script/dashboards.js), but
     right here in the dashboard itself so a panel can be shown/hidden
     without leaving the page. Checking/unchecking applies immediately
     (adds/removes .dash-section-off on the matching element) and
     persists via the same setDashboardSectionVisible() Settings uses --
     the two stay in sync automatically since they share one storage key
     per dashboard, not because either one pushes state to the other. -->
<script>
  function renderPanelsMenu() {
    const menu = document.getElementById("panelsMenu");
    menu.innerHTML = "";
    const hidden = getHiddenDashboardSections(currentDashboardId);
    DASHBOARD_SECTIONS.forEach(({ key, label }) => {
      const row = document.createElement("label");
      row.className = "dash-panels-menu-item";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !hidden.includes(key);
      cb.addEventListener("click", (e) => e.stopPropagation());
      cb.addEventListener("change", () => {
        setDashboardSectionVisible(currentDashboardId, key, cb.checked);
        const el = document.getElementById(key);
        if (el) el.classList.toggle("dash-section-off", !cb.checked);
      });
      row.appendChild(cb);
      row.appendChild(document.createTextNode(label));
      menu.appendChild(row);
    });
  }

  renderPanelsMenu();

  (function initPanelsPicker() {
    const picker = document.getElementById("panelsPicker");
    const btn = document.getElementById("btnPanelsMenu");
    const menu = document.getElementById("panelsMenu");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".dash-shell-menu.open").forEach((m) => {
        if (m !== menu) m.classList.remove("open");
      });
      menu.classList.toggle("open");
      notifyShellMenuState();
    });
    document.addEventListener("click", (e) => {
      if (!picker.contains(e.target)) {
        menu.classList.remove("open");
        notifyShellMenuState();
      }
    });
  })();
</script>


<!-- "🔗 Link" picker (next to "⟲ Disposition") -- routes this tab's
     "Shell" commands into another browser tab. The state and the live
     peer list live in assets/script/tab-link.js (index.html); this is
     only the control, kept in sync over postMessage and re-queried on a
     2s poll so the tab list updates on its own, same cadence as
     tab-link.js's own presence heartbeat. -->
<script>
  (function initTabLink() {
    const picker = document.getElementById("tabLinkPicker");
    const btn = document.getElementById("btnTabLink");
    const menu = document.getElementById("tabLinkMenu");
    if (!picker || !btn || !menu) return;

    const embedded = window.self !== window.top;
    let state = { peers: [], enabled: false, targetId: null };

    function query() {
      if (embedded) window.top.postMessage({ type: "tablink-query" }, "*");
    }
    function setState(enabled, targetId) {
      if (embedded) window.top.postMessage({ type: "tablink-set", enabled, targetId }, "*");
    }

    function targetLabel() {
      const p = state.peers.find((x) => x.tabId === state.targetId);
      return p ? p.label : null;
    }

    function render() {
      const name = targetLabel();
      const active = state.enabled && !!name;
      btn.textContent = active ? "🔗 → " + name : "🔗 Link";
      btn.classList.toggle("tl-on", active);

      menu.innerHTML = "";

      const toggle = document.createElement("label");
      toggle.className = "dash-panels-menu-item";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = state.enabled;
      cb.addEventListener("click", (e) => e.stopPropagation());
      cb.addEventListener("change", () => {
        const t = state.targetId || (state.peers[0] && state.peers[0].tabId) || null;
        setState(cb.checked, t);
      });
      toggle.appendChild(cb);
      toggle.appendChild(document.createTextNode("Actif"));
      menu.appendChild(toggle);

      if (state.peers.length === 0) {
        const empty = document.createElement("div");
        empty.className = "dash-shell-menu-item";
        empty.style.opacity = "0.6";
        empty.style.cursor = "default";
        empty.textContent = "Aucun autre onglet ouvert";
        menu.appendChild(empty);
      } else {
        state.peers.forEach((p) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "dash-shell-menu-item";
          item.textContent = (p.tabId === state.targetId ? "● " : "") + p.label;
          item.addEventListener("click", () => setState(true, p.tabId));
          menu.appendChild(item);
        });
      }
    }

    window.addEventListener("message", (e) => {
      if (!e.data) return;
      if (e.data.type === "tablink-state") {
        state = {
          peers: Array.isArray(e.data.peers) ? e.data.peers : [],
          enabled: !!e.data.enabled,
          targetId: e.data.targetId || null,
        };
        render();
      } else if (e.data.type === "tablink-activity") {
        btn.classList.add("tl-pulse");
        clearTimeout(btn._tlPulseTimer);
        btn._tlPulseTimer = setTimeout(() => btn.classList.remove("tl-pulse"), 300);
      }
    });

    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".dash-shell-menu.open").forEach((m) => {
        if (m !== menu) m.classList.remove("open");
      });
      menu.classList.toggle("open");
      notifyShellMenuState();
      query();
    });
    document.addEventListener("click", (e) => {
      if (!picker.contains(e.target)) {
        menu.classList.remove("open");
        notifyShellMenuState();
      }
    });

    render();
    query();
    setInterval(query, 2000);
  })();
</script>


<!-- DASHBOARD SECTIONS VISIBILITY (Settings > Sections du Dashboard) --
     a dedicated class (see dashboard-panels.css) so it can't be undone by
     the collapse button's .collapsed toggling or shells-host.js's .hidden
     toggling on #panelShells, which are both separate, session-only
     mechanisms that never touch this one. -->
<script>
  (function () {
    getHiddenDashboardSections(currentDashboardId).forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.classList.add("dash-section-off");
    });
  })();
</script>


<!-- FREEFORM PANEL LAYOUT (assets/script/dashboard-layout.js) -- runs
     last so it measures panels' default positions only after the
     sections-visibility pass above has finished hiding whatever's off
     for this dashboard. -->
<script>
  initDashboardLayout(currentDashboardId);
</script>
