<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'">
  <link rel="icon" type="image/svg+xml" href="../assets/images/dragon-logo.svg">
  <link rel="icon" type="image/png" href="../assets/images/dragon-favicon.png">
  <title>Dashboard</title>
  <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/network-dashboard.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/dashboard-panels.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/fs-explorer.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/pentest.css">

</head>



<body class="theme-standard" data-page-key="dashboard">

<div class="wallpaper"></div>

<div class="hud-bg">
  <div class="hud-grid"></div>
</div>

<div class="network-shell">
  <div class="network-header">
    <div class="network-header-left">
      <h1 class="category-title">Dashboard</h1>
      <div class="hud-legend" id="hudLegend">
        <span class="hud-legend-item"><span class="hud-legend-dot online"></span><span data-i18n="dash.legend.online">En ligne</span></span>
        <span class="hud-legend-item"><span class="hud-legend-dot offline"></span><span data-i18n="dash.legend.offline">Injoignable</span></span>
        <span class="hud-legend-item"><span class="hud-legend-dot checking"></span><span data-i18n="dash.legend.checking">Vérification</span></span>
      </div>
    </div>

    <div class="dash-topbar-actions">
      <div class="dash-shell-picker" id="dashboardPicker">
        <button id="btnDashboardMenu" class="dash-btn" type="button" data-i18n="dash.btn.dashboards">☰ Dashboards</button>
        <div class="dash-shell-menu" id="dashboardMenu"></div>
      </div>

      <div class="dash-shell-picker" id="shellPicker">
        <button id="btnAddShell" class="dash-btn" type="button" data-i18n="dash.btn.addShell">+ Shell</button>
        <div class="dash-shell-menu" id="shellMenu">
          <button type="button" class="dash-shell-menu-item" data-shell="bash">Bash</button>
          <button type="button" class="dash-shell-menu-item" data-shell="zsh">Zsh</button>
          <button type="button" class="dash-shell-menu-item" data-shell="pwsh">PowerShell</button>
        </div>
      </div>

      <div class="dash-shell-picker" id="panelsPicker">
        <button id="btnPanelsMenu" class="dash-btn" type="button" data-i18n="dash.btn.panels">☰ Panneaux</button>
        <div class="dash-shell-menu dash-panels-menu" id="panelsMenu"></div>
      </div>

      <button id="btnResetLayout" class="dash-btn" type="button" data-i18n="dash.btn.resetLayout" data-i18n-title="dash.btn.resetLayoutTitle" title="Remet chaque panneau à sa position et taille d'origine">⟲ Disposition</button>

      <div class="dash-shell-picker" id="tabLinkPicker">
        <button id="btnTabLink" class="dash-btn" type="button" data-i18n="dash.btn.link" data-i18n-title="dash.btn.linkTitle" title="Link -- renvoyer les commandes « Shell » de cet onglet vers un autre onglet ouvert">🔗 Link</button>
        <div class="dash-shell-menu dash-panels-menu" id="tabLinkMenu"></div>
      </div>

      <button id="btnQuickFinding" class="dash-btn" type="button" data-i18n="dash.btn.quickFinding" data-i18n-title="dash.btn.quickFindingTitle" title="Ajouter un finding à une mission pentest existante, sans quitter le dashboard">+ Finding</button>
    </div>

    <div class="hud-status grc-header-status" id="grcHeaderStatus">
      <div class="hud-status-text">
        <div class="hud-status-title" data-i18n="dash.grcCoverage">Couverture GRC</div>
        <div class="grc-progress-track"><div class="grc-progress-fill"></div></div>
        <div class="hud-status-count" id="grcHeaderCount">0 / 0 — 0%</div>
      </div>
    </div>

    <div class="status-group" id="dragonSlot">
      <div class="hud-status">
        <svg class="hud-gauge" viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="42"></circle>
          <circle class="value" cx="50" cy="50" r="42"></circle>
          <text class="hud-gauge-label" x="50" y="52">--</text>
        </svg>
        <div class="hud-status-text">
          <div class="hud-status-title">Gotham Network — Status</div>
          <div class="hud-status-count">-- / -- NODES ONLINE</div>
          <div class="hud-clock" id="hudClock">--:--:--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Freeform layout (assets/script/dashboard-layout.js): every panel
       below stays in this exact original row/column flex layout -- and
       keeps every dynamic behavior tied to it (Shells/Network sizing
       each other, Log/GRC's own natural/shrink sizing, the responsive
       :has() rules in dashboard-panels.css) -- until the moment the user
       actually drags its header or its resize grip. Only THEN does that
       one panel detach to a free position/size (frozen from wherever it
       already was on screen at that instant, so nothing jumps), which
       persists per dashboard. A panel nobody has touched is completely
       unaffected by any of this, forever. -->
  <div class="dash-row-top">
    <div class="dash-panel dash-panel-shells hidden" id="panelShells">
      <div class="dash-panel-header">
        <span class="dash-panel-title" data-i18n="dash.panel.shells">Shells</span>
        <button class="dash-collapse-btn" type="button" data-target="panelShells">–</button>
      </div>
      <div class="dash-panel-body dash-shells-body" id="shellArea"></div>
      <div class="dash-resize-handle" data-target="panelShells"></div>
    </div>

    <div class="dash-panel dash-panel-network" id="panelNetwork">
      <div class="dash-panel-header">
        <span class="dash-panel-title" data-i18n="dash.panel.network">Réseau</span>
        <button class="dash-collapse-btn" type="button" data-target="panelNetwork">–</button>
      </div>
      <div class="dash-panel-body">
        <div class="grid" id="reseau-grid"></div>
      </div>
      <div class="dash-resize-handle" data-target="panelNetwork"></div>
    </div>
  </div>

  <!-- FS Explorer (assets/script/fs-explorer.js) -- visual filesystem
       manager wired to the ttyd/tmux shell panes. Off by default (see
       DEFAULT_DASHBOARD_HIDDEN_SECTIONS in dashboards.js); enable via
       "☰ Panneaux" or Settings > Sections du Dashboard. Full design in
       spec/fs-explorer/. -->
  <div class="dash-panel dash-panel-fs" id="panelFs">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.explorer">Explorateur</span>
      <button class="dash-collapse-btn" type="button" data-target="panelFs">–</button>
    </div>
    <div class="dash-panel-body">
      <div class="fsx-root" id="fsExplorerBody"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelFs"></div>
  </div>

  <div class="dash-panel dash-panel-tools" id="panelTools">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.tools">Outils</span>
      <button class="dash-collapse-btn" type="button" data-target="panelTools">–</button>
    </div>
    <div class="dash-panel-body">
      <!-- Populated from the Tools category registry (assets/script/
           tools-config.js, managed from Settings > Config Tools) --
           see renderToolsPanel() below. -->
      <div class="tools-panel-grid" id="toolsPanelGrid"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelTools"></div>
  </div>

  <div class="dash-panel dash-panel-devsecops" id="panelDevSecOps">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.devsecops">DevSecOps</span>
      <button class="dash-collapse-btn" type="button" data-target="panelDevSecOps">–</button>
    </div>
    <div class="dash-panel-body">
      <!-- Populated from the DevSecOps category registry (assets/script/
           devsecops-config.js, managed from Settings > Config DevSecOps)
           -- same tile-grid + modal pattern as the Tools panel above,
           see renderDevSecOpsPanel() below. -->
      <div class="tools-panel-grid" id="devsecopsPanelGrid"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelDevSecOps"></div>
  </div>

  <div class="dash-panel dash-panel-website" id="panelWebsite">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.website">Website</span>
      <button class="dash-collapse-btn" type="button" data-target="panelWebsite">–</button>
    </div>
    <div class="dash-panel-body">
      <!-- Populated from the Website category registry (assets/script/
           website-config.js, managed from Settings > Config Website) --
           see renderWebsitePanel() below. -->
      <div class="website-panel-grid" id="websitePanelGrid"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelWebsite"></div>
  </div>

  <div class="dash-panel dash-panel-grc" id="panelGrc">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.grcCoverage">Couverture GRC</span>
      <button class="dash-collapse-btn" type="button" data-target="panelGrc">–</button>
    </div>
    <div class="dash-panel-body">
      <div id="grc-dashboard-coverage"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelGrc"></div>
  </div>

  <div class="dash-panel dash-panel-reviews" id="panelUpcomingReviews">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.upcomingReviews">Prochaines revues</span>
      <button class="dash-collapse-btn" type="button" data-target="panelUpcomingReviews">–</button>
    </div>
    <div class="dash-panel-body">
      <div id="upcomingReviewsList"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelUpcomingReviews"></div>
  </div>

  <div class="dash-panel dash-panel-log" id="panelLog">
    <div class="dash-panel-header">
      <span class="dash-panel-title" data-i18n="dash.panel.systemLog">System log</span>
      <button class="dash-collapse-btn" type="button" data-target="panelLog">–</button>
    </div>
    <div class="dash-panel-body">
      <div class="hud-log-body" id="hudLogBody"></div>
    </div>
    <div class="dash-resize-handle" data-target="panelLog"></div>
  </div>
</div>


<div id="overlay"></div>

<!-- Shared tool modal (same pattern as tools.html): loads the picked
     section's standalone page in an iframe. -->
<div id="modal-tool" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-tool-title"></div>
    <iframe id="modal-tool-frame" src="about:blank" title="Tool section"></iframe>
  </div>
</div>

<!-- Website resource modal (same pattern as website.html's OSINT modal),
     shares #overlay with the Tools modal above. -->
<div id="modal-website" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="website-title"></div>
    <div id="website-content"></div>
  </div>
</div>

<!-- "+ Finding rapide" modal (assets/script/pentest-quick-add.js) --
     same inline-content pattern as #modal-website above, not an
     iframe: adds a finding to an EXISTING pentest engagement without
     leaving the dashboard. -->
<div id="modal-quick-finding" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Finding rapide</div>
    <div id="quick-finding-content"></div>
  </div>
</div>


<!-- CONFIG-DRIVEN DASHBOARD -->
<script src="../assets/script/i18n.js"></script>
<script src="../config/encryption.js"></script>
<script src="../assets/script/vault-crypto.js"></script>
<script src="../assets/script/theme-accent.js"></script>
<script src="../assets/script/vault.js"></script>
<script src="../assets/script/vault-ui.js"></script>
<script src="../config/reseau.js"></script>
<script src="../assets/script/network-config.js"></script>
<script src="../assets/script/dashboards.js"></script>
<script src="../assets/script/wallpaper-loader.js"></script>
<script src="../assets/script/page-effects.js"></script>
<script src="../assets/script/page-effects-loader.js"></script>
<script src="../assets/script/system-log.js"></script>
<script src="../assets/script/network-dashboard.js"></script>
<script src="../assets/script/dashboard-shells.js"></script>
<script src="../assets/script/dashboard-layout.js"></script>
<script src="../config/gtfobins.js"></script>
<script src="../config/lolbas.js"></script>
<script src="../config/shell-session.js"></script>
<script src="../assets/script/fs-explorer.js"></script>
<script src="../assets/script/onboarding-target.js"></script>
<script src="../assets/script/inline/dashboard-network.js"></script>


<!-- GRC COVERAGE PANEL -->
<script src="../grc/index.js"></script>
<script src="../grc/securite/api/index.js"></script>
<script src="../grc/securite/database/index.js"></script>
<script src="../grc/securite/reseau/index.js"></script>
<script src="../grc/securite/webapp/index.js"></script>
<!-- encryption.js/vault-crypto.js/vault.js/vault-ui.js already loaded
     above for the network section -- const/let bindings there would
     throw "already declared" on a second <script> load. -->
<script src="../assets/script/grc-checklist.js"></script>
<script src="../assets/script/inline/dashboard-grc-coverage.js"></script>


<!-- UPCOMING REVIEWS PANEL (TodoGRC.txt #6) -- dérivé des dates déjà
     présentes dans les registres actifs/risques, aucun stockage propre.
     Juste les getters : pas d'appel à initGrc*Registry() ici. -->
<script src="../assets/script/config-io.js"></script>
<!-- grc-risks.js (comme grc-pentest.js plus bas) est bâti sur
     grc-registry-kit.js depuis PlanDurcissement-Securite.txt P2 --
     chargé ici, réutilisé par grc-pentest.js plus bas. -->
<script src="../assets/script/grc-registry-kit.js"></script>
<script src="../assets/script/grc-assets.js"></script>
<script src="../assets/script/grc-risks.js"></script>
<script src="../assets/script/inline/dashboard-upcoming-reviews.js"></script>


<!-- "+ Finding rapide" (Couverture GRC panel) -- vault/vault-ui/config-io
     already loaded above. grc-pentest.js is built on grc-registry-kit.js
     since PlanDurcissement-Securite.txt P2 (grkStore/grkEnsure/grkId/
     grkEscapeHtml at module scope -- would throw without this first);
     grc-registry-kit.js already loaded above (for grc-risks.js).
     dashboard.html has no grc-i18n.js, so its grcT()-dependent bits
     degrade to plain French, see grc-pentest.js's own typeof guards. -->
<script src="../assets/script/grc-pentest.js"></script>
<script src="../assets/script/pentest-quick-add.js"></script>


<!-- TOOLS MODAL -->
<script src="../assets/script/tools-config.js"></script>
<script src="../assets/script/inline/dashboard-tools-tiles.js"></script>


<!-- DEVSECOPS MODAL (same pattern as the Tools panel/modal above, its own
     registry/localStorage key -- see assets/script/devsecops-config.js) -->
<script src="../assets/script/devsecops-config.js"></script>
<script src="../assets/script/inline/dashboard-devsecops-tiles.js"></script>


<!-- WEBSITE MODAL (same pattern as website.html's openOsintModal) -->
<script src="../assets/script/website-config.js"></script>
<script src="../assets/script/inline/dashboard-website-tiles.js"></script>


<!-- THEME LOADER -->
<script src="../assets/script/inline/theme-change-notify.js"></script>


<!-- DASHBOARD SWITCHER -- which dashboard this load of the page is (see
     assets/script/dashboards.js): read from ?id=, default when absent or
     unknown (eg. a dashboard deleted from another tab). Settings has one
     "Sections du Dashboard" card per entry in the same registry. -->
<script src="../assets/script/inline/dashboard-picker.js"></script>


<!-- "☰ Panneaux" picker -- same toggles as Settings > Sections du
     Dashboard (DASHBOARD_SECTIONS, assets/script/dashboards.js), but
     right here in the dashboard itself so a panel can be shown/hidden
     without leaving the page. Checking/unchecking applies immediately
     (adds/removes .dash-section-off on the matching element) and
     persists via the same setDashboardSectionVisible() Settings uses --
     the two stay in sync automatically since they share one storage key
     per dashboard, not because either one pushes state to the other. -->
<script src="../assets/script/inline/dashboard-panels-menu.js"></script>


<!-- "🔗 Link" picker (next to "⟲ Disposition") -- routes this tab's
     "Shell" commands into another browser tab. The state and the live
     peer list live in assets/script/tab-link.js (index.html); this is
     only the control, kept in sync over postMessage and re-queried on a
     2s poll so the tab list updates on its own, same cadence as
     tab-link.js's own presence heartbeat. -->
<script src="../assets/script/inline/dashboard-tab-link.js"></script>


<!-- DASHBOARD SECTIONS VISIBILITY (Settings > Sections du Dashboard) --
     a dedicated class (see dashboard-panels.css) so it can't be undone by
     the collapse button's .collapsed toggling or shells-host.js's .hidden
     toggling on #panelShells, which are both separate, session-only
     mechanisms that never touch this one. -->
<script src="../assets/script/inline/dashboard-hidden-sections.js"></script>


<!-- FREEFORM PANEL LAYOUT (assets/script/dashboard-layout.js) -- runs
     last so it measures panels' default positions only after the
     sections-visibility pass above has finished hiding whatever's off
     for this dashboard. -->
<script src="../assets/script/inline/dashboard-layout-init.js"></script>
<script src="../assets/script/inline/apply-i18n.js"></script>




</body>
</html>
