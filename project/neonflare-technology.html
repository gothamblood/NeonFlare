<style>
  /* This page fills .grid with a real card grid (not the single centered
     card the global .grid { padding: 15rem } hack is built for). Reset
     that padding + the 1fr row-stretch, cap the width and centre it, and
     sit the row of cards in the vertical middle of the viewport. */
  .grid {
    padding: 2rem;
    box-sizing: border-box;
    max-width: 1080px;
    margin: 0 auto;
    min-height: calc(100vh - 6rem);
    align-content: center;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    grid-auto-rows: auto;
  }
</style>

</head>
