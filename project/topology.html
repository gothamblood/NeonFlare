<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'">
  <link rel="icon" type="image/svg+xml" href="../assets/images/dragon-logo.svg">
  <link rel="icon" type="image/png" href="../assets/images/dragon-favicon.png">
  <title>Network Topology</title>

  <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
  <link rel="stylesheet" type="text/css" href="../assets/css/topology.css">

  <style>

.modal {
  position: fixed;
  width: 20%;
  background: rgba(0,0,0,0.45); /* un peu plus léger */
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;          /* centre vertical */
  justify-content: center;      /* centre horizontal */
  z-index: 9999;
}


.modal-content {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  box-shadow: 0 0 18px var(--panel-glow);
  padding: 14px;
  border-radius: 10px;
  width: 200px;
  text-align: center;
  animation: modalPop 0.25s ease;
}

@keyframes modalPop {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal-close {
  float: right;
  font-size: 22px;
  cursor: pointer;
  color: var(--accent);
}

#modalUrlBtn {
  margin-top: 14px;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--accent);
  color: #000;
  font-weight: 600;
  cursor: pointer;
  border: none;
}

.node {
  transition: box-shadow 0.25s ease, filter 0.25s ease;
}

.node:hover {
  box-shadow: 0 0 22px var(--accent);
  filter: brightness(1.15);
}

.node-row {
  display: flex;
  align-items: center;
  gap: 10px; 
}


  </style>
</head>
<body>
  <main class="topology-shell">
    <header class="topology-header">
      <div>
        <div class="topology-title">Network Topology</div>
        <div class="topology-subtitle">GothamBlood environment</div>
      </div>
      <!-- <div class="topology-theme-tag">Themed · Neon‑Ready</div> -->
    </header>

    <div id="topologyVaultGate"></div>

    <section class="topology-canvas">
      <svg id="linkLayer" class="link-layer"></svg>
    </section>
  </main>





  <div id="nodeModal" class="modal">
  <div class="modal-content">
    <span class="modal-close">&times;</span>

    <h2 id="modalTitle"></h2>
    <p id="modalSpec"></p>

    <button id="modalUrlBtn">Ouvrir le lien</button>
  </div>
  </div>


</body>

<script src="../config/encryption.js"></script>
<script src="../assets/script/vault-crypto.js"></script>
<script src="../assets/script/theme-accent.js"></script>
<script src="../assets/script/vault.js"></script>
<script src="../assets/script/vault-ui.js"></script>
<script src="../config/topology.js"></script>
<script src="../assets/script/topology-loader.js"></script>
<script src="../assets/script/topology-config.js"></script>
<script src="../assets/script/inline/topology.js"></script>
</html>
