server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;

    # Security headers. CSP is intentionally left out here -- this site
    # leans on inline <script> blocks throughout (theme/lang sync
    # boilerplate on nearly every page), so a real script-src policy
    # needs either 'unsafe-inline' (weak) or per-script hashes (a
    # maintenance burden that's easy to let drift silently on a static
    # site with no build step to catch it). Revisit as its own project,
    # not bundled into this pass.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Internal-only files that must never be reachable, regardless of
    # deployment method. .dockerignore only keeps them out of the Docker
    # image -- these rules also cover copying the folder straight to a
    # webroot. 404, not 403, so a probe can't tell the difference from a
    # path that simply doesn't exist.
    location ~* ^/(Jenkinsfile|web\.config|nginx\.conf)$ {
        deny all;
        return 404;
    }
    location ^~ /scripts/ {
        deny all;
        return 404;
    }
    # Any other dotfile (.git, .env, .dockerignore, ...) -- same reasoning.
    location ~ /\. {
        deny all;
        return 404;
    }

    # The shell-bridge session token lives in this one generated file
    # (scripts/ttyd-shells.sh rewrites it on start/stop). Cross-Origin-
    # Resource-Policy stops another origin from pulling it in with
    # <script src> and reading the token off the closure's helpers; the
    # token also must never be cached. Headers are re-stated because a
    # location that sets its own add_header drops the inherited ones.
    location = /config/shell-session.js {
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Short cache lifetime so a new deploy shows up for visitors within
    # minutes instead of needing a manual hard refresh (mirrors web.config).
    # Repeats the security headers above -- add_header does NOT inherit
    # into a location block that defines its own add_header, it's
    # replaced instead, per nginx's documented behavior.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
