server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;

    # Security headers. script-src 'self' is now included: every inline
    # <script> block and on*="" handler across the 83 pages of the site
    # has been externalized into assets/script/inline/ (Plan
    # Durcissement-Securite.txt P1.1/P1.2, project/settings.html --
    # 2800+ lines / 54 handlers, the last holdout -- included), each
    # page's own <meta> CSP already carries it. This add_header
    # duplicates the whole policy as a real HTTP header for parity (a
    # <meta> CSP can in principle be raced/overridden by an early
    # injected <meta> if some other XSS ever slips through the
    # script-src net itself; a real header can't be) and because
    # frame-ancestors is silently ignored inside a <meta> element
    # regardless.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Internal-only files that must never be reachable, regardless of
    # deployment method. .dockerignore only covers the Docker image
    # build -- these rules also cover copying the repo straight to a
    # webroot (see telechargement.html's "nginx manuel" / "en local"
    # instructions, neither of which goes through .dockerignore at
    # all). 404, not 403, so a probe can't tell the difference from a
    # path that simply doesn't exist.
    location ~* ^/(TODOSecurityStandpoint\.txt|Jenkinsfile|web\.config|nginx\.conf)$ {
        deny all;
        return 404;
    }
    location ^~ /scripts/ {
        deny all;
        return 404;
    }
    location ^~ /unused/ {
        deny all;
        return 404;
    }
    # Pristine spare copy of the site kept in the repo -- never meant to
    # be reachable as a nested second site under /BrandNew/.
    location ^~ /BrandNew/ {
        deny all;
        return 404;
    }
    # Any other dotfile (.git, .env, .dockerignore, ...) -- same reasoning.
    location ~ /\. {
        deny all;
        return 404;
    }

    # The shell-bridge session token lives in this one generated file
    # (scripts/ttyd-shells.sh rewrites it on start/stop). Cross-Origin-
    # Resource-Policy stops another origin from pulling it in with
    # <script src> and reading the token off the closure's helpers; the
    # token also must never be cached. Headers are re-stated because a
    # location that sets its own add_header drops the inherited ones.
    location = /config/shell-session.js {
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Short cache lifetime so a new deploy shows up for visitors within
    # minutes instead of needing a manual hard refresh (mirrors web.config).
    # Repeats the security headers above -- add_header does NOT inherit
    # into a location block that defines its own add_header, it's
    # replaced instead, per nginx's documented behavior.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
